<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Доска проектов</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="appbar">
        <div class="brand">
          <span class="brand-sign" aria-hidden="true"
            ><i></i><i></i><i></i
          ></span>
          <span>Доска проектов</span>
        </div>
        <nav class="views" aria-label="Представление">
          <span class="view-highlight" aria-hidden="true"></span>
          <button type="button" id="board-view" title="Колонки задач выбранных проектов. Карточки можно переносить между колонками." aria-pressed="true">
            <svg class="icon-line" aria-hidden="true">
              <use href="/vendor/lucide.svg#columns-3"></use></svg
            ><span>Доска</span></button
          ><button type="button" id="inbox-view" title="Предложения задач, чаты без проекта и готовые черновики описаний." aria-pressed="false">
            <svg class="icon-line" aria-hidden="true"><use href="/vendor/lucide.svg#layers-2"></use></svg>
            <span>Неразобранные задачи</span><span class="nav-count" id="inbox-count"></span></button
          ><button type="button" id="focus-view" title="Задачи, отмеченные звездой на сегодняшнюю дату. Список начинается заново в полночь по Москве." aria-pressed="false">
            <svg class="icon-line" aria-hidden="true">
              <use href="/vendor/lucide.svg#star"></use></svg
            ><span>Фокус дня</span
            ><span class="nav-count" id="focus-count"></span></button
          ><button type="button" id="dates-view" title="Ближайшие сроки незавершённых задач выбранных проектов." aria-pressed="false">
            <svg class="icon-line" aria-hidden="true">
              <use href="/vendor/lucide.svg#calendar-days"></use></svg
            ><span>Сроки</span
            ><span class="nav-count" id="dates-count"></span></button
          ><button type="button" id="chats-view" title="Обнаруженные чаты Codex и связанные с ними карточки." aria-pressed="false">
            <svg class="icon-line" aria-hidden="true">
              <use href="/vendor/lucide.svg#messages-square"></use></svg
            ><span>Чаты</span
            ><span class="nav-count" id="chat-count"></span></button
          ><button type="button" id="snoozed-view" title="Посмотреть отложенные задачи и проекты. Сюда можно перетащить карточку." aria-pressed="false">
            <svg class="icon-line" aria-hidden="true"><use href="/vendor/lucide.svg#clock-3"></use></svg>
            <span>Отложенные</span><span class="nav-count" id="snoozed-count"></span></button
          ><button type="button" id="trash-view" title="Удалённые проекты, чаты и карточки можно восстановить." aria-pressed="false">
            <svg class="icon-line" aria-hidden="true">
              <use href="/vendor/lucide.svg#trash-2"></use></svg
            ><span>Корзина</span
            ><span class="nav-count" id="trash-count"></span>
          </button>
        </nav>
        <div class="sync-area">
          <button id="sources" type="button" title="Какие источники доска проверила и какие ассистенты обращались к ней">Источники</button>
          <button id="sync" type="button" title="Проверить изменения в чатах Codex всех проектов и загрузить предложения ассистентов">
            <svg class="icon-line" aria-hidden="true"><use href="/vendor/lucide.svg#refresh-cw"></use></svg>
            Обновить доску
          </button>
        </div>
      </header>
      <main>
        <header class="heading">
          <div class="heading-text">
            <h1 id="page-title">Общая доска</h1>
            <div class="overview" id="overview"></div>
            <p id="inbox-help" hidden>Пропущенные предложения больше не появятся при синхронизации.</p>
          </div>
          <form id="quick-task" class="quick-task" aria-label="Создание задачи">
            <button
              id="add"
              class="compose-open"
              type="button"
              aria-label="Открыть полную форму задачи"
              title="Открыть полную форму задачи"
            >
              <svg class="icon-line" aria-hidden="true">
                <use href="/vendor/lucide.svg#plus"></use>
              </svg>
            </button>
            <input
              id="quick-title" title="Введите название и нажмите Enter. Кнопка «+» открывает полную форму."
              type="text"
              maxlength="200"
              autocomplete="off"
              aria-label="Название новой задачи"
              placeholder="Новая задача…"
            />
            <button
              class="compose-enter"
              type="submit"
              aria-label="Добавить введённую задачу"
              title="Добавить задачу"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M19 5v8H5m5-5-5 5 5 5" />
              </svg>
            </button>
          </form>
        </header>
        <div class="project-bar">
          <div class="project-picker" id="project-picker">
            <button type="button" class="project-filter-toggle" id="project-filter-toggle" aria-controls="project-options" aria-expanded="false">
              Проекты <span class="project-total" id="project-total"></span>
              <svg class="icon-line" aria-hidden="true"><use href="/vendor/lucide.svg#chevron-down"></use></svg>
            </button>
            <div id="project-options" role="group" aria-label="Показывать на доске" hidden>
              <label class="project-option all-projects"><input type="checkbox" id="all-projects"> Все проекты</label>
              <div id="project-options-list"></div>
            </div>
          </div>
          <div id="projects" role="group" aria-label="Выбранные проекты"></div>
          <button id="create-project" class="ghost project-create" type="button" aria-label="Создать проект" title="Создать проект на доске"><svg class="icon-line" aria-hidden="true"><use href="/vendor/lucide.svg#plus"></use></svg><span>Проект</span></button>
          <button id="rename-project" class="ghost rename-button" type="button" aria-label="Переименовать проект" title="Переименовать проект или распределить его чаты"><svg class="icon-line" aria-hidden="true" viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l4-1 12-12a2.8 2.8 0 0 0-4-4L4 15z"/></svg><span>Переименовать</span></button>
          <button
            class="icon ghost"
            id="settings"
            title="Настройки доски и проекта"
            aria-label="Настройки доски и проекта"
            type="button"
          >
            <svg class="icon-line" aria-hidden="true">
              <use href="/vendor/lucide.svg#settings-2"></use>
            </svg>
          </button>
        </div>
        <div id="nearest" hidden></div>
        <section class="workspace" aria-label="Задачи и чаты">
          <div class="toolbar">
            <div class="filters">
              <button
                class="ghost attention"
                id="attention" title="Блокеры, новые ответы, просрочки, сроки в ближайшие 7 дней и задачи, которые долго остаются в колонке."
                aria-pressed="false"
                type="button"
              >
                <svg class="icon-line" aria-hidden="true">
                  <use href="/vendor/lucide.svg#list-filter"></use></svg
                >Требует внимания <span id="attention-count">0</span>
              </button>
              <button type="button" class="ghost" id="draft-queue" title="Проверить черновики описаний по всем проектам">Черновики описаний <span id="draft-count"></span></button>
              <select id="tag-filter" title="Показывает карточки с выбранным тегом во всех видимых проектах." aria-label="Фильтр по тегу" hidden></select>
              <select
                id="topic-filter" title="Показывает карточки одной темы выбранного проекта."
                aria-label="Фильтр по теме"
                hidden
              ></select>
            </div>
            <label class="search-box"
              ><svg class="icon-line" aria-hidden="true">
                <use href="/vendor/lucide.svg#search"></use></svg
              ><input
                type="search"
                id="search" title="Поиск по задачам и чатам. В неразобранных задачах можно искать также по проекту и источнику."
                placeholder="Поиск"
                aria-label="Поиск задач и чатов"
            /></label>
          </div>
          <p id="sync-state" class="check-feedback" role="status" aria-live="polite">Открываем доску…</p>
          <p id="project-discovery" class="check-feedback" hidden></p>
          <div id="naming-offers" hidden></div>
          <section id="waiting-list" hidden aria-label="Ждут вашего ответа"></section>
          <div id="snooze-drop" hidden>Отложить до…</div>
          <div id="content">
            <p class="empty-page" role="status">Загружаем доску…</p>
          </div>
        </section>
      </main>
    </div>
    <dialog id="modal"></dialog>
    <dialog id="snooze-modal"></dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>
